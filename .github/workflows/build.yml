name: Build debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # Optionnel : secret GitHub pour afficher de vraies affiches (voir README).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publie aussi l'APK dans une release « latest » : lien de téléchargement direct,
      # pratique pour l'installer depuis la TV (appli Downloader) sans se connecter à GitHub.
      - name: Publish release "latest"
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppleTV Launcher (dernier build debug)
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
